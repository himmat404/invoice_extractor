# Local development infrastructure. Start with: docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: invoiceflow
      POSTGRES_PASSWORD: invoiceflow
      POSTGRES_DB: invoiceflow
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data, ./infra/postgres:/docker-entrypoint-initdb.d:ro]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoiceflow"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: invoiceflow
      MINIO_ROOT_PASSWORD: invoiceflow-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

volumes:
  pgdata:
  miniodata:
